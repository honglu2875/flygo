[package]
name = "flygo-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
fly-core = { path = "../fly-core" }
go-actors = { path = "../go-actors" }
go-search = { path = "../go-search" }
pyo3 = { version = "=0.27.1", features = ["extension-module", "abi3-py312"] }
numpy = "=0.27.0"
serde_json = "=1.0.145"
