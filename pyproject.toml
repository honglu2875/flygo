[build-system]
requires = ["maturin==1.9.4"]
build-backend = "maturin"

[project]
name = "flygo"
version = "0.1.0"
description = "Fixed-connectome Go research: Rust execution and Python experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.3"]

[project.optional-dependencies]
jax = ["jax==0.11.1", "jaxlib==0.11.1"]
data = ["pyarrow==25.0.1"]

[project.scripts]
flygo = "flygo.cli:main"

[tool.maturin]
manifest-path = "crates/flygo-python/Cargo.toml"
python-source = "python"
module-name = "flygo._native"

[dependency-groups]
dev = ["maturin==1.9.4"]
